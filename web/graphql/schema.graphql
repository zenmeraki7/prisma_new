// web/graphql/schema.graphql

type Query {
  snapshotStatus(snapshotRunId: ID!): SnapshotRun
}

type Mutation {
  createSnapshot(productIds: [String!]!): CreateSnapshotResult!
  downloadExport(snapshotRunId: ID!, format: String!): ExportResult!
}

type SnapshotRun {
  id: ID!
  state: String!
  progress: Int!
  total: Int!
  planHash: String!
}

type CreateSnapshotResult {
  snapshotRunId: ID!
  reused: Boolean!
}

type ExportResult {
  data: String!
  filename: String!
}