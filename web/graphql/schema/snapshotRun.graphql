# FILE: web/graphql/schema/snapshotRuns.graphql (or merged into your main schema)

enum SnapshotRunStatus {
  QUEUED
  RUNNING
  INGESTING
  COMPLETED
  FAILED
}

type SnapshotRun {
  id: ID!
  shopId: String!
  status: SnapshotRunStatus!
  progress: Int!
  total: Int!
  filterSummary: String!
  planHash: String!
  errorMessage: String
  createdAt: String!
  updatedAt: String!
}

type SnapshotRunEdge {
  cursor: String!
  node: SnapshotRun!
}

type SnapshotRunsPageInfo {
  hasNextPage: Boolean!
  hasPreviousPage: Boolean!
  startCursor: String
  endCursor: String
}

type SnapshotRunsPage {
  edges: [SnapshotRunEdge!]!
  pageInfo: SnapshotRunsPageInfo!
  totalCount: Int!
}

extend type Query {
  snapshotRuns(first: Int, after: String): SnapshotRunsPage!
}
