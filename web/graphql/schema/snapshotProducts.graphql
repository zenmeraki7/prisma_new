# FILE: web/graphql/schema/snapshotProducts.graphql

type SnapshotProduct {
  id: ID!
  productId: String!
  snapshotRunId: String!
  description: String
  seoTitle: String
  seoDescription: String
  searchEngineVisibility: SearchEngineVisibility
}

type SnapshotProductEdge {
  cursor: String!
  node: SnapshotProduct!
}

type SnapshotProductConnection {
  edges: [SnapshotProductEdge!]!
  pageInfo: PageInfo!
  totalCount: Int!
}

type Query {
  snapshotProducts(
    snapshotRunId: ID!
    first: Int = 50
    after: String
    filter: FastProductFilterInput
  ): SnapshotProductConnection!
}
